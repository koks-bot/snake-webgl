<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
  <title>Snake</title>
  <link rel="shortcut icon" href="TemplateData/favicon.ico">
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #0c111a;
    }
    #unity-container {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0c111a;
    }
    #unity-canvas {
      display: block;
      outline: none;
      background: #0c111a;
      touch-action: none;
    }
    #unity-loading-bar {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      display: none;
      text-align: center;
    }
    #unity-logo {
      width: 154px;
      height: 130px;
      margin: 0 auto 24px;
      background: url('TemplateData/unity-logo-dark.png') no-repeat center;
      background-size: contain;
    }
    #unity-progress-bar-empty {
      width: 240px;
      height: 12px;
      border: 1px solid #6df26d;
      background: #141c28;
    }
    #unity-progress-bar-full {
      width: 0;
      height: 100%;
      background: #6df26d;
    }
    #unity-warning {
      position: absolute;
      left: 50%;
      top: 12px;
      transform: translateX(-50%);
      z-index: 10;
      color: #111;
    }
  </style>
</head>
<body>
  <div id="unity-container">
    <canvas id="unity-canvas" width="960" height="640" tabindex="0"></canvas>
    <div id="unity-loading-bar">
      <div id="unity-logo"></div>
      <div id="unity-progress-bar-empty"><div id="unity-progress-bar-full"></div></div>
    </div>
    <div id="unity-warning"></div>
  </div>
  <script>
    var canvas = document.querySelector('#unity-canvas');
    var loadingBar = document.querySelector('#unity-loading-bar');
    var progressBar = document.querySelector('#unity-progress-bar-full');
    var warningBanner = document.querySelector('#unity-warning');

    function resizeCanvas() {
      var aspect = 960 / 640;
      var width = window.innerWidth;
      var height = window.innerHeight;
      if (width / height > aspect) width = Math.floor(height * aspect);
      else height = Math.floor(width / aspect);
      canvas.style.width = width + 'px';
      canvas.style.height = height + 'px';
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();
    canvas.addEventListener('pointerdown', function () { canvas.focus(); });

    function unityShowBanner(msg, type) {
      var div = document.createElement('div');
      div.innerHTML = msg;
      div.style = type === 'error'
        ? 'background:#b3261e;color:white;padding:10px;'
        : 'background:#ffe14d;padding:10px;';
      warningBanner.appendChild(div);
      if (type !== 'error') setTimeout(function () { warningBanner.removeChild(div); }, 5000);
    }

    var buildUrl = 'Build';
    var config = {
      arguments: [],
      dataUrl: buildUrl + '/Build.data.unityweb',
      frameworkUrl: buildUrl + '/Build.framework.js.unityweb',
      codeUrl: buildUrl + '/Build.wasm.unityweb',
      streamingAssetsUrl: 'StreamingAssets',
      companyName: 'bibinos',
      productName: 'Snake',
      productVersion: '1.0',
      showBanner: unityShowBanner
    };

    loadingBar.style.display = 'block';
    var script = document.createElement('script');
    script.src = buildUrl + '/Build.loader.js';
    script.onload = function () {
      createUnityInstance(canvas, config, function (progress) {
        progressBar.style.width = 100 * progress + '%';
      }).then(function () {
        loadingBar.style.display = 'none';
        canvas.focus();
      }).catch(function (message) {
        unityShowBanner(message, 'error');
      });
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
